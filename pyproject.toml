[project]
name = "llmc"
version = "0.1.0"
description = "Injecting gated code modules into small transformers"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "numpy", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmc"]
